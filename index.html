<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#183050">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EP CRM">
<title>Effekten Parkett CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='6' fill='%23183050'/%3E%3Cpath d='M9 21v-6M15 21V10M21 21V7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M6.5 24h17' stroke='%23D8B25A' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: marineblaue Kopfleiste mit Reitern, darunter eine Inhaltsspalte (max. 1180px). Listen werden unter 760px zu Karten, Detailseiten unter 900px einspaltig. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --fg:#13223A; --muted:#5A6779;
  --line:#DCE1E9; --line-strong:#C2CAD6;
  --brand:#183050; --brand-line:rgba(255,255,255,.14); --brand-dim:rgba(255,255,255,.72);
  --pri:#183050; --pri-fg:#FFFFFF; --link:#1F4A80;
  --gold:#A9822A; --gold-soft:#F6EED9; --gold-fg:#3A2C08;
  --b-tone:#183050; --b-soft:#E3EAF3;
  --c-tone:#6E7888; --c-soft:#EEF0F3;
  --danger:#B42318; --danger-soft:#FDECEA; --warn:#9A5507; --warn-soft:#FEF2DC; --ok:#08724A; --ok-soft:#E4F4EB;
  --tk-warn:#FDB022;
  --shadow:0 1px 2px rgba(19,34,58,.06),0 10px 30px rgba(19,34,58,.12);
  --scrim:rgba(10,18,30,.5);
  --f-display:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141F; --surface:#132031; --surface-2:#172639; --fg:#E5EAF1; --muted:#98A4B6;
    --line:#233249; --line-strong:#33465F;
    --brand:#14294A; --brand-line:rgba(255,255,255,.12); --brand-dim:rgba(255,255,255,.7);
    --pri:#8DB4EA; --pri-fg:#0C141F; --link:#8DB4EA;
    --gold:#D8B25A; --gold-soft:#3A2F14; --gold-fg:#F6E7BF;
    --b-tone:#8DB4EA; --b-soft:#1B2C45;
    --c-tone:#8E99AA; --c-soft:#1C2737;
    --danger:#F97066; --danger-soft:#3B1A1A; --warn:#FDB022; --warn-soft:#3A2A0E; --ok:#47CD89; --ok-soft:#10301F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141F; --surface:#132031; --surface-2:#172639; --fg:#E5EAF1; --muted:#98A4B6;
  --line:#233249; --line-strong:#33465F;
  --brand:#14294A; --brand-line:rgba(255,255,255,.12); --brand-dim:rgba(255,255,255,.7);
  --pri:#8DB4EA; --pri-fg:#0C141F; --link:#8DB4EA;
  --gold:#D8B25A; --gold-soft:#3A2F14; --gold-fg:#F6E7BF;
  --b-tone:#8DB4EA; --b-soft:#1B2C45;
  --c-tone:#8E99AA; --c-soft:#1C2737;
  --danger:#F97066; --danger-soft:#3B1A1A; --warn:#FDB022; --warn-soft:#3A2A0E; --ok:#47CD89; --ok-soft:#10301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
body.modal-open{overflow:hidden}
a{color:var(--link)}
button{font:inherit}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff}
.top-in,.tabs-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand .gold{stroke:var(--gold)}
.wm{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.wm-1{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;font-weight:500;white-space:nowrap}
.wm-2{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-dim);white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-dim)}
.me select{color-scheme:dark;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 8px;font:14px var(--f-ui);letter-spacing:0;text-transform:none;max-width:180px}
.tabs{border-top:1px solid var(--brand-line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{color:var(--brand-dim);text-decoration:none;padding:10px 12px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;border-bottom-color:var(--gold)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}

/* Seitenkopf */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.ph h1{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,4vw,36px);line-height:1.1;letter-spacing:.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 12px;font:500 14px var(--f-ui);cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit;text-align:left}

/* Hinweise */
.note{border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.note.warn b{color:var(--warn)}
.note.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-fg)}

/* Kurstafel */
.ticker{background:var(--brand);color:#fff;border-radius:var(--r);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));overflow:hidden;margin-bottom:20px}
.tk{padding:14px 16px;border-right:1px solid var(--brand-line);border-bottom:1px solid var(--brand-line);text-decoration:none;color:inherit}
.tk-l{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-dim)}
.tk-v{font:500 28px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.tk-v.warn{color:var(--tk-warn)}

/* Bereiche */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font:600 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel-b{padding:14px 16px}
.panel-b > p:first-child{margin-top:0}
.panel-b > p:last-child{margin-bottom:0}
.empty{padding:16px;color:var(--muted);font-size:14px}
.g2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g3{grid-template-columns:minmax(0,1fr)}}

/* Wichtigkeit */
.kl{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:24px;padding:0 8px;border-radius:5px;font:600 12px var(--f-ui);letter-spacing:.03em;border:1px solid;flex:none;white-space:nowrap}
.kl.A{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-fg)}
.kl.B{background:var(--b-soft);border-color:var(--b-tone);color:var(--b-tone)}
.kl.C{background:var(--c-soft);border-color:var(--line-strong);color:var(--c-tone)}
.kl.lg{min-width:96px;height:36px;font-size:16px;border-radius:7px}
.kl.sm{min-width:54px;height:20px;font-size:11px;padding:0 6px;border-radius:4px}
.dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.dots i{display:block;width:8px;height:8px;border-radius:50%;border:1px solid var(--line-strong)}
.dots i.on{background:var(--pri);border-color:var(--pri)}
.wbox{display:flex;gap:12px;align-items:flex-start}
.wbox b{font-size:16px}
.wbox p{margin:4px 0 0;color:var(--muted);font-size:14px}
.rw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12.5px}
.rw-s{padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.rw-s.up{background:var(--ok-soft);color:var(--ok)}
.rw-s.down{background:var(--danger-soft);color:var(--danger)}
.bsp-r{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.bsp-r .rw{margin-top:0}
.umgang{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.umgang b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
table.mx{border-collapse:separate;border-spacing:3px;font-size:12.5px;margin:10px 0 0;width:100%}
table.mx th{font-weight:500;color:var(--muted);text-align:center;padding:2px;font-size:11px;line-height:1.25}
table.mx tbody th{text-align:left}
table.mx td{text-align:center;padding:4px 2px;border-radius:6px;border:2px solid transparent}
table.mx .kl.sm{min-width:0;width:100%;max-width:72px}
table.mx td.hl{border-color:var(--fg);background:var(--surface-2)}
table.mx.big{font-size:14px;border-spacing:6px;width:auto;min-width:min(100%,560px)}
table.mx.big th{font-size:13px}
table.mx.big tbody th{white-space:nowrap}
table.mx.big td{padding:10px 4px}

.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.due{display:inline-block;font:500 12px var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.due.over{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.due.today{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.due.soon{background:var(--b-soft);color:var(--b-tone);border-color:transparent}

/* Werkzeugleiste */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools .search{flex:1 1 240px;min-width:0}
.tools input,.tools select{font:14px var(--f-ui);color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;max-width:100%}
.tools .search input{width:100%}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;max-width:100%}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer;font:500 13px var(--f-ui);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:var(--pri-fg)}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;cursor:pointer}

/* Listen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp{padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp b{color:var(--fg);letter-spacing:.06em}
.row{display:grid;grid-template-columns:72px minmax(0,2.1fr) minmax(0,1.7fr) minmax(0,.9fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row.fr{grid-template-columns:44px minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.list > .row:last-child{border-bottom:0}
a.row:hover{background:var(--surface-2)}
.row-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.r-main{min-width:0}
.r-title{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{display:none;color:var(--muted);font-size:12.5px;margin-top:2px}
.r-col{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){
  .row,.row.fr{grid-template-columns:72px minmax(0,1fr);align-items:start}
  .row.fr{grid-template-columns:44px minmax(0,1fr)}
  .row .r-col,.row-h{display:none}
  .r-meta{display:block}
}

.il{list-style:none;margin:0;padding:0}
.il li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.il li:last-child{border-bottom:0}
.il .grow{flex:1;min-width:0}
.il .t{font-weight:600;color:inherit;text-decoration:none}
.il a.t:hover{text-decoration:underline}
.il .s{font-size:13px;color:var(--muted)}
.il .side{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Stufen-Übersicht */
.funnel{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;padding:14px 16px}
@media (max-width:760px){.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fs{border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-decoration:none;color:inherit;background:var(--surface-2);min-width:0}
.fs b{display:block;font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.fs span{display:block;font-size:11.5px;line-height:1.25;color:var(--muted)}
.fs.zero b{color:var(--line-strong)}

/* Detailseiten */
.back{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--fg)}
.dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.dh-main{flex:1 1 320px;min-width:0}
.dh h1{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,4.5vw,40px);margin:0;line-height:1.08;text-wrap:balance}
.dh .sub{color:var(--muted);margin-top:4px}
.dh .chips{margin-top:10px}
.detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
dl.kv{display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow span{user-select:all}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next .what{font-size:16px;font-weight:600}
.pre{white-space:pre-wrap;margin:0}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .d{font:13px var(--f-mono);color:var(--muted);padding-top:2px}
.tl .c{min-width:0}
.tl .c p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tl .m{font-size:12.5px;color:var(--muted);margin-top:4px}
@media (max-width:520px){.tl li{grid-template-columns:minmax(0,1fr) auto}.tl .d{grid-column:1/-1}}

/* Organigramm */
.org{padding:6px 16px 16px}
.lvl{position:relative;padding:14px 0 6px}
.lvl + .lvl{border-top:1px dashed var(--line)}
.lvl-h{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:10px}
.lvl-c{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.oc{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:228px;max-width:100%;text-decoration:none;color:inherit}
.oc:hover{border-color:var(--line-strong);background:var(--surface-2)}
.oc.A{border-color:var(--gold)}
.oc .n{font-weight:600;font-size:14px;line-height:1.25}
.oc .p{font-size:12.5px;color:var(--muted);line-height:1.3}
.oc .u{font-size:11.5px;color:var(--muted)}
.oc-empty{border:1px dashed var(--line-strong);border-radius:8px;padding:9px 14px;color:var(--muted);font-size:13px}

/* Tafel */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
@media (max-width:760px){.board{grid-auto-columns:84%}}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:140px;scroll-snap-align:start;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 2px 10px}
.col-h b{font-family:var(--f-mono);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card-t{background:none;border:0;padding:0;text-align:left;font:600 14px var(--f-ui);color:var(--fg);cursor:pointer;overflow-wrap:anywhere}
.card-t:hover{text-decoration:underline}
.card-s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

/* ---------- Datenbank ---------- */
async function put(col, obj){
  if (!S.db){ toast('Keine Verbindung zur Datenbank. Lade die Seite neu und melde dich an.', 'err'); throw new Error('nodb'); }
  const id = obj.id || uid(col.slice(0,1));
  const body = {};
  for (const k of Object.keys(obj)){ if (k !== 'id' && obj[k] !== undefined) body[k] = obj[k]; }
  const now = new Date().toISOString();
  body.geaendert = now;
  if (!body.erstellt) body.erstellt = now;
  try { await S.db.collection(col).doc(id).set(body); return id; }
  catch(e){ writeErr(e); throw e; }
}
async function del(col, id){
  if (!S.db){ toast('Keine Verbindung zur Datenbank.', 'err'); throw new Error('nodb'); }
  try { await S.db.collection(col).doc(id).delete(); }
  catch(e){ writeErr(e); throw e; }
}
function writeErr(e){
  const c = e && e.code;
  if (c === 'invalid_argument' && !S.canWriteKnown){ S.canWrite = false; S.canWriteKnown = true; scheduleRender(); toast('Speichern nicht möglich: Du hast nur Lesezugriff.', 'err'); return; }
  if (c === 'permission-denied'){ toast('Speichern nicht erlaubt. Stehst du noch auf der Freigabeliste?', 'err'); return; }
  if (c === 'resource-exhausted'){ toast('Das kostenlose Tageslimit von Firebase ist erreicht. Morgen geht es wieder.', 'err'); return; }
  if (c === 'quota_exceeded'){ toast('Die Datenbank ist voll. Lösche alte Einträge im Verlauf, dann klappt es wieder.', 'err'); return; }
  if (c === 'unavailable'){ toast('Kurz keine Verbindung. Bitte noch einmal speichern.', 'err'); return; }
  toast('Speichern hat nicht geklappt' + (e && e.message ? ': ' + e.message : '.'), 'err');
}
/* ---------- Firebase: Anmeldung, Freigabeliste und Datenbank ----------
   Ablauf: Einstellungen prüfen → Firebase laden → angemeldet? → E-Mail bestätigt? → auf der Freigabeliste? → Daten laden.
   Die Freigabeliste liegt in der Sammlung „zugang“. Dokument-ID = E-Mail-Adresse in Kleinbuchstaben, Feld rolle = verwalter oder mitglied. */
const AUTH = {fb:null, auth:null, db:null, user:null, rolle:'', zugang:{}, unsubs:[], gate:'laden', gateMsg:'', modus:'anmelden', info:'', lastMail:'', busy:false, run:0};
const meineMail = () => AUTH.user ? String(AUTH.user.email || '').toLowerCase() : '';

async function loadFirebase(){
  if (window.EP_FIREBASE_MOCK) return window.EP_FIREBASE_MOCK; /* nur für lokale Tests */
  const m = await Promise.all([import(FB_URL + 'firebase-app.js'), import(FB_URL + 'firebase-auth.js'), import(FB_URL + 'firebase-firestore.js')]);
  return Object.assign({}, m[0], m[1], m[2]);
}
/* Offline wartet Firebase mit dem Bestätigen, bis wieder Netz da ist. Dann nicht blockieren, sondern im Hintergrund übertragen. */
function settle(p){
  if (navigator.onLine !== false) return p;
  p.catch(writeErr);
  toast('Du bist offline. Die Änderung wird übertragen, sobald du wieder Netz hast.');
  return Promise.resolve();
}
/* Gleiche Schnittstelle wie vorher: db.collection(name).doc(id).set(...) / .delete() / collection(name).onSnapshot(...) */
function adapter(fb, db){
  return {collection: name => ({
    doc: id => ({
      set: body => settle(fb.setDoc(fb.doc(db, name, id), body)),
      delete: () => settle(fb.deleteDoc(fb.doc(db, name, id)))
    }),
    onSnapshot: (ok, err) => fb.onSnapshot(fb.collection(db, name), ok, err)
  })};
}

async function connect(){
  const cfg = window.EP_FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /EINTRAGEN/.test(cfg.apiKey) || !cfg.projectId){ showGate('setup'); return; }
  let fb;
  try { fb = await loadFirebase(); }
  catch(e){ console.error(e); showGate('fehler', 'Firebase konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.'); return; }
  AUTH.fb = fb;
  try {
    const app = fb.initializeApp(cfg);
    AUTH.auth = fb.getAuth(app);
    AUTH.auth.languageCode = 'de';
    AUTH.db = fb.initializeFirestore(app, {ignoreUndefinedProperties:true});
  } catch(e){ console.error(e); showGate('fehler', 'Die Einstellungen in firebase-config.js stimmen nicht. ' + (e && e.message ? e.message : '')); return; }
  fb.onAuthStateChanged(AUTH.auth, u => { AUTH.user = u; pruefeZugang(); });
}

async function pruefeZugang(){
  const run = ++AUTH.run;
  stopDaten();
  let u = AUTH.user;
  if (!u){ showGate('anmelden'); return; }
  if (!u.emailVerified){
    try { await u.reload(); } catch(e){}
    if (run !== AUTH.run) return;
    u = AUTH.auth.currentUser || u; AUTH.user = u;
    if (!u.emailVerified){ showGate('bestaetigen'); return; }
  }
  showGate('pruefen');
  try {
    /* Die Zugriffsregeln prüfen die Bestätigung im Anmelde-Ausweis. Ist der noch von vor der Bestätigung, frisch holen. */
    const tok = await u.getIdTokenResult();
    if (!tok.claims.email_verified) await u.getIdToken(true);
    const snap = await AUTH.fb.getDoc(AUTH.fb.doc(AUTH.db, 'zugang', meineMail()));
    if (run !== AUTH.run) return;
    if (!snap.exists()){ showGate('warten'); return; }
    AUTH.rolle = (snap.data() || {}).rolle === 'verwalter' ? 'verwalter' : 'mitglied';
  } catch(e){
    if (run !== AUTH.run) return;
    console.error(e);
    if (e && e.code === 'permission-denied'){ showGate('warten'); return; }
    showGate('fehler', 'Die Freigabe konnte nicht geprüft werden. ' + (e && e.message ? e.message : ''));
    return;
  }
  startDaten(run);
}

function startDaten(run){
  hideGate();
  const db = adapter(AUTH.fb, AUTH.db);
  S.db = db; S.canWrite = true; S.canWriteKnown = true; S.dbState = 'connecting'; S.loaded = new Set();
  const slow = setTimeout(() => { if (S.dbState === 'connecting'){ S.dbState = 'slow'; scheduleRender(); } }, 10000);
  const fehler = err => {
    clearTimeout(slow);
    if (run !== AUTH.run) return;
    console.error(err);
    if (err && err.code === 'permission-denied'){ pruefeZugang(); return; }
    S.dbState = 'error'; scheduleRender();
  };
  for (const c of COLS){
    AUTH.unsubs.push(db.collection(c).onSnapshot(snap => {
      const o = {};
      for (const d of snap.docs){ const v = d.data(); if (v) o[d.id] = Object.assign({}, v, {id:d.id}); }
      S.data[c] = o;
      if (!snap.metadata.fromCache) S.loaded.add(c);
      if (S.loaded.size === COLS.length){ clearTimeout(slow); S.dbState = 'ok'; }
      scheduleRender();
    }, fehler));
  }
  AUTH.unsubs.push(db.collection('zugang').onSnapshot(snap => {
    const o = {};
    for (const d of snap.docs) o[d.id] = Object.assign({}, d.data(), {id:d.id});
    AUTH.zugang = o;
    const ich = o[meineMail()];
    if (!ich){ pruefeZugang(); return; }
    AUTH.rolle = ich.rolle === 'verwalter' ? 'verwalter' : 'mitglied';
    scheduleRender();
  }, fehler));
  render();
}

function stopDaten(){
  for (const u of AUTH.unsubs){ try { u(); } catch(e){} }
  AUTH.unsubs = []; AUTH.zugang = {}; AUTH.rolle = '';
  S.db = null; S.loaded = new Set(); S.dbState = 'connecting';
  S.data = {firmen:{},kontakte:{},anfragen:{},verlauf:{},vorlagen:{},team:{}};
}

async function abmelden(){
  closeModal();
  AUTH.modus = 'anmelden'; AUTH.info = '';
  if (location.hash && location.hash !== '#start') history.replaceState(null, '', '#start');
  try { if (AUTH.fb && AUTH.auth) await AUTH.fb.signOut(AUTH.auth); } catch(e){}
}

function authFehler(e){
  const c = e && e.code || '';
  const M = {
    'auth/invalid-credential':'E-Mail oder Passwort stimmt nicht.',
    'auth/invalid-login-credentials':'E-Mail oder Passwort stimmt nicht.',
    'auth/wrong-password':'E-Mail oder Passwort stimmt nicht.',
    'auth/user-not-found':'E-Mail oder Passwort stimmt nicht.',
    'auth/invalid-email':'Das ist keine gültige E-Mail-Adresse.',
    'auth/missing-email':'Bitte gib deine E-Mail-Adresse ein.',
    'auth/missing-password':'Bitte gib dein Passwort ein.',
    'auth/email-already-in-use':'Für diese Adresse gibt es schon ein Konto. Melde dich einfach an.',
    'auth/weak-password':'Das Passwort braucht mindestens 6 Zeichen.',
    'auth/too-many-requests':'Zu viele Versuche. Warte ein paar Minuten und versuche es dann noch einmal.',
    'auth/network-request-failed':'Keine Verbindung zum Internet.',
    'auth/operation-not-allowed':'Die Anmeldung mit E-Mail und Passwort ist in Firebase noch nicht eingeschaltet.',
    'auth/unauthorized-domain':'Diese Webadresse ist in Firebase noch nicht freigegeben. Trage sie unter Authentication, Einstellungen, Autorisierte Domains ein.',
    'auth/unauthorized-continue-uri':'Diese Webadresse ist in Firebase noch nicht freigegeben. Trage sie unter Authentication, Einstellungen, Autorisierte Domains ein.',

  };
  return M[c] || ('Das hat nicht geklappt' + (e && e.message ? ': ' + e.message : '.'));

async function loginSubmit(form){
  if (AUTH.busy || !AUTH.fb) return;
  const v = readForm(form), m = AUTH.modus, fb = AUTH.fb, err = $('#g-err');
  const mail = String(v.mail || '').trim();
  AUTH.lastMail = mail;
  if (m === 'registrieren' && v.pw !== v.pw2){ err.textContent = 'Die beiden Passwörter sind nicht gleich.'; return; }
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true; AUTH.busy = true; err.textContent = '';
  try {
    if (m === 'anmelden') await fb.signInWithEmailAndPassword(AUTH.auth, mail, v.pw);
    else if (m === 'registrieren'){
      AUTH.modus = 'anmelden';
      const c = await fb.createUserWithEmailAndPassword(AUTH.auth, mail, v.pw);
      await fb.sendEmailVerification(c.user);
    } else {
      await fb.sendPasswordResetEmail(AUTH.auth, mail);
      AUTH.modus = 'anmelden';
      AUTH.info = 'Falls es ein Konto mit dieser Adresse gibt, ist der Link unterwegs. Schau auch im Spam-Ordner nach.';
      renderGate();
    }
  } catch(e){
    if (m === 'registrieren' && !AUTH.user) AUTH.modus = 'registrieren';
    const el = $('#g-err'); if (el) el.textContent = authFehler(e);
    const b = $('#login [type=submit]'); if (b) b.disabled = false;
  }
  AUTH.busy = false;
}

/* ---------- Darstellung ---------- */
let renderPending = false;
function scheduleRender(){ if (renderPending) return; renderPending = true; setTimeout(() => { renderPending = false; render(); }, 16); }

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.indexOf('k-') === 0) return {v:'kontakt', id:h.slice(2), tab:'kontakte'};
  if (h.indexOf('u-') === 0) return {v:'firma', id:h.slice(2), tab:'unternehmen'};
  const v = ['start','kontakte','unternehmen','anfragen','vorlagen','hilfe','team'].includes(h) ? h : 'start';
  return {v:v, tab:v};
}
function render(){
  derive();
  document.body.classList.toggle('ro', !S.canWrite);
  renderHeader();
  const view = $('#view');
  const ae = document.activeElement;
  const fid = ae && ae.id && view.contains(ae) ? ae.id : null;
  let selRange = null;
  try { if (fid && typeof ae.selectionStart === 'number') selRange = [ae.selectionStart, ae.selectionEnd]; } catch(e){}
  const r = route();
  let html = '';
  try {
    html = r.v === 'kontakt' ? viewKontakt(r.id) : r.v === 'firma' ? viewFirma(r.id) :
      r.v === 'kontakte' ? viewKontakte() : r.v === 'unternehmen' ? viewFirmen() :
      r.v === 'anfragen' ? viewAnfragen() : r.v === 'vorlagen' ? viewVorlagen() :
      r.v === 'hilfe' ? viewHilfe() : r.v === 'team' ? viewTeam() : viewStart();
  } catch(e){
    console.error(e);
    html = '<div class="note warn"><b>Diese Ansicht konnte nicht angezeigt werden.</b> ' + esc(e.message) + '</div>';
  }
  view.innerHTML = html;
  if (fid){
    const n = document.getElementById(fid);
    if (n){ n.focus(); if (selRange && n.setSelectionRange){ try { n.setSelectionRange(selRange[0], selRange[1]); } catch(e){} } }
  }
}

function dbNote(){
  if (!S.canWrite) return '<div class="note warn"><b>Nur Lesezugriff.</b> Du kannst gerade nichts speichern.</div>';
  if (S.dbState === 'none') return '<div class="note warn"><b>Keine Datenbank verbunden.</b> Lade die Seite neu und melde dich an.</div>';
  if (S.dbState === 'slow') return '<div class="note warn"><b>Die Datenbank antwortet gerade nicht.</b> Angezeigte Daten können veraltet sein.</div>';
  if (S.dbState === 'error' || S.dbState === 'revoked') return '<div class="note warn"><b>Verbindung zur Datenbank verloren.</b> Lade die Seite neu.</div>';
  return '';
}
function loading(){ return S.dbState === 'connecting' && S.loaded.size < COLS.length && !Object.keys(S.data.kontakte).length && !Object.keys(S.data.firmen).length; }
function notFound(what, back){ return '<a class="back" href="#' + back + '">Zurück</a><div class="panel"><div class="empty">' + (loading() ? 'Daten werden geladen.' : esc(what) + ' gibt es nicht mehr. Vielleicht wurde der Eintrag gelöscht.') + '</div></div>'; }

/* ---------- Übersicht ---------- */
function faelligItems(){
  const D = S.data, out = [];
  for (const k of Object.values(D.kontakte)){
    if (!isDate(k.wiedervorlage)) continue;
    out.push({typ:'k', id:k.id, datum:k.wiedervorlage, titel:kName(k), sub:fName(D.firmen[k.firmaId]), was:k.naechsterSchritt || 'Nächster Schritt', owner:k.verantwortlich, kl:kontaktKlasse(k)});
  }
  for (const a of Object.values(D.anfragen)){
    if (!isDate(a.wiedervorlage) || a.stufe === 'nachbereitet' || a.stufe === 'abgesagt') continue;
    const f = D.firmen[a.firmaId];
    out.push({typ:'a', id:a.id, datum:a.wiedervorlage, titel:(fmtKurz(a.format) || 'Anfrage') + (f ? ' bei ' + f.name : ''), sub:stufeLabel(a.stufe), was:a.naechsterSchritt || 'Nächster Schritt', owner:a.verantwortlich});
  }
  return out.sort((x,y) => x.datum.localeCompare(y.datum));
}
function viewStart(){
  const D = S.data, today = todayStr(), sem = semesterOf(today);
  const ks = Object.values(D.kontakte), fs = Object.values(D.firmen), as = Object.values(D.anfragen);
  const datum = new Date().toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  let h = '<div class="ph"><div><div class="eyebrow">' + esc(datum) + ' · ' + esc(sem) + '</div><h1>Übersicht</h1></div>' +
    '<div class="actions w"><button class="btn" data-act="newAnfrage">Neue Anfrage</button><button class="btn pri" data-act="newKontakt">Neuer Kontakt</button></div></div>' + dbNote();
  if (loading()) return h + '<div class="panel"><div class="empty">Daten werden geladen.</div></div>';
  if (!ks.length && !fs.length && !as.length) return h + welcome();

  const me = meId();
  const alle = faelligItems();
  const overAll = alle.filter(i => i.datum < today).length;
  let items = alle.filter(i => daysBetween(today, i.datum) <= 7);
  if (S.ui.nurMeine && me) items = items.filter(i => i.owner === me);
  const offen = as.filter(a => !['durchgefuehrt','nachbereitet','abgesagt'].includes(a.stufe));
  const top = ks.map(k => ({k:k, w:wichtigkeit(k)})).filter(x => x.w.kl === 'A');
  const zusagen = as.filter(a => ['zugesagt','planung','durchgefuehrt','nachbereitet'].includes(a.stufe) && anfrageSemester(a) === sem).length;

  const tk = (l, v, href, warn) => '<a class="tk" href="' + href + '"><div class="tk-l">' + esc(l) + '</div><div class="tk-v' + (warn ? ' warn' : '') + '">' + v + '</div></a>';
  h += '<div class="ticker" aria-label="Kennzahlen">' +
    tk('Top-Kontakte', top.length, '#kontakte') + tk('Kontakte', ks.length, '#kontakte') + tk('Unternehmen', fs.length, '#unternehmen') +
    tk('Offene Anfragen', offen.length, '#anfragen') + tk('Überfällig', overAll, '#start', overAll > 0) + tk('Zusagen ' + sem, zusagen, '#anfragen') + '</div>';

  let fl = '<section class="panel"><div class="panel-h"><h2>Fällig in den nächsten 7 Tagen</h2>' +
    (me ? '<label class="check"><input type="checkbox" id="f-meine" data-filter="nurMeine"' + (S.ui.nurMeine ? ' checked' : '') + '> Nur meine</label>' : '') + '</div>';
  if (!items.length) fl += '<div class="empty">' + (S.ui.nurMeine ? 'Für dich ist nichts fällig.' : 'Nichts fällig. Alle Wiedervorlagen liegen weiter in der Zukunft.') + '</div>';
  else fl += '<ul class="il">' + items.map(i => '<li>' + (i.typ === 'k' ? badge(i.kl, 'sm') : '<span class="chip">Anfrage</span>') +
    '<div class="grow"><a class="t" href="' + (i.typ === 'k' ? '#k-' + i.id : '#anfragen') + '">' + esc(i.titel) + '</a><div class="s">' + esc(i.was) + ' · ' + esc(i.sub) + '</div></div>' +
    '<div class="side">' + duePill(i.datum) + '<span class="s">' + esc(tName(i.owner) || 'ohne Verantwortlichen') + '</span></div></li>').join('') + '</ul>';
  fl += '</section>';

  let al = '<section class="panel"><div class="panel-h"><h2>Top-Kontakte</h2><a href="#hilfe" class="s">Warum Top?</a></div>';
  if (!top.length) al += '<div class="empty">Noch keine Top-Kontakte. Top wird vor allem, wer in der Chefetage sitzt, bei einem sehr bekannten Unternehmen arbeitet oder nah an der HfWU ist.</div>';
  else al += '<ul class="il">' + top.slice(0, 8).map(x => {
    const k = x.k, last = S.letzter[k.id];
    return '<li>' + badge('A', 'sm') + '<div class="grow"><a class="t" href="#k-' + k.id + '">' + esc(kName(k)) + '</a><div class="s">' + esc(warumKurz(x.w)) + ' · ' + esc(fName(D.firmen[k.firmaId])) + '</div></div>' +
      '<div class="side"><span class="s">' + (last ? 'zuletzt ' + esc(sinceTxt(last)) : 'noch kein Kontakt') + '</span>' + duePill(k.wiedervorlage) + '</div></li>';
  }).join('') + '</ul>';
  al += '</section>';

  h += '<div class="g2">' + fl + al + '</div>';

  const cnt = {};
  for (const a of as) cnt[a.stufe || 'recherche'] = (cnt[a.stufe || 'recherche'] || 0) + 1;
  h += '<section class="panel" style="margin-top:20px"><div class="panel-h"><h2>Anfragen nach Stufe</h2><a href="#anfragen">Zur Tafel</a></div><div class="funnel">' +
    STUFEN.map(s => '<a class="fs' + (cnt[s.v] ? '' : ' zero') + '" href="#anfragen"><b>' + (cnt[s.v] || 0) + '</b><span>' + esc(s.l) + '</span></a>').join('') + '</div></section>';

  const pflege = ks.map(k => {
    const kl = kontaktKlasse(k), since = S.letzter[k.id] || dateOf(k.erstellt);
    const age = since ? daysBetween(since, today) : 0;
    return {k:k, kl:kl, since:since, over: age - PFLEGE[kl]};
  }).filter(x => x.over > 0 && !(isDate(x.k.wiedervorlage) && x.k.wiedervorlage >= today))
    .sort((x,y) => x.kl.localeCompare(y.kl) || y.over - x.over);
  let pl = '<section class="panel"><div class="panel-h"><h2>Pflege fällig</h2><span class="s muted">Top alle 3, Wichtig alle 6, Normal alle 12 Monate</span></div>';
  if (!pflege.length) pl += '<div class="empty">Alle Kontakte wurden im vorgesehenen Abstand gepflegt.</div>';
  else pl += '<ul class="il">' + pflege.slice(0, 8).map(x => '<li>' + badge(x.kl, 'sm') + '<div class="grow"><a class="t" href="#k-' + x.k.id + '">' + esc(kName(x.k)) + '</a><div class="s">' + esc(fName(D.firmen[x.k.firmaId])) + '</div></div><div class="side"><span class="s">' + (S.letzter[x.k.id] ? 'zuletzt ' + esc(sinceTxt(S.letzter[x.k.id])) : 'angelegt ' + esc(sinceTxt(x.since))) + '</span></div></li>').join('') + '</ul>';
  const ohne = fs.filter(f => f.wunschpartner && !ks.some(k => k.firmaId === f.id));
  if (ohne.length) pl += '<div class="panel-h" style="border-top:1px solid var(--line)"><h2>Wunschpartner ohne Ansprechpartner</h2></div><ul class="il">' +
    ohne.map(f => '<li>' + dots(f.bekanntheit) + '<div class="grow"><a class="t" href="#u-' + f.id + '">' + esc(f.name) + '</a><div class="s">' + esc(f.branche || '') + '</div></div><div class="side w"><button class="btn sm" data-act="newKontakt" data-firma="' + f.id + '">Kontakt anlegen</button></div></li>').join('') + '</ul>';
  pl += '</section>';

  const termine = as.filter(a => isDate(a.termin) && semesterOf(a.termin) === sem && a.stufe !== 'abgesagt').sort((x,y) => x.termin.localeCompare(y.termin));
  let tl = '<section class="panel"><div class="panel-h"><h2>Termine ' + esc(sem) + '</h2></div>';
  if (!termine.length) tl += '<div class="empty">In diesem Semester steht noch kein fester Termin.</div>';
  else tl += '<ul class="il">' + termine.map(a => '<li><span class="due' + (a.termin < today ? '' : ' soon') + '">' + fmtDE(a.termin) + '</span><div class="grow"><span class="t">' + esc(fmtKurz(a.format)) + ' · ' + esc(fName(D.firmen[a.firmaId])) + '</span><div class="s">' + esc(stufeLabel(a.stufe)) + (a.teilnehmerGeplant ? ' · ' + esc(a.teilnehmerGeplant) + ' Teilnehmer geplant' : '') + '</div></div></li>').join('') + '</ul>';
  tl += '</section>';

  h += '<div class="g2" style="margin-top:20px">' + pl + tl + '</div>';
  return h;
}
function welcome(){
  return '<section class="panel welcome"><div class="panel-b">' +
    '<h2>Willkommen im CRM des Corporate Relations Teams</h2>' +
    '<p class="muted" style="max-width:66ch">Hier sammelt ihr alle Unternehmen und Ansprechpartner. Das CRM sagt euch bei jedem Kontakt, wie wichtig er ist: Top, Wichtig oder Normal. Dafür braucht ihr kein Vorwissen über Banken oder Jobtitel.</p>' +
    '<ol class="steps">' +
    '<li><div><b>Team eintragen</b><p>Unter Team &amp; Daten legt ihr alle Mitglieder an. Danach wählst du oben rechts unter „Ich bin“ deinen Namen.</p><a class="btn sm" href="#team">Zum Team</a></div></li>' +
    '<li><div><b>Spickzettel lesen</b><p>Zwei Minuten, dann weißt du, wer wichtig ist und was Titel wie „Head of“ oder „Board Member“ bedeuten.</p><a class="btn sm" href="#hilfe">Zum Spickzettel</a></div></li>' +
    '<li><div><b>Unternehmen anlegen</b><p>Zwei Fragen: Wie bekannt ist es, und in welcher Stadt sitzt es? Die Entfernung zur HfWU rechnet das CRM selbst aus.</p><button class="btn sm w" data-act="newFirma">Unternehmen anlegen</button></div></li>' +
    '<li><div><b>Ansprechpartner anlegen</b><p>Jobtitel eintragen, das CRM erkennt die Stufe und zeigt, wie wichtig die Person ist.</p><button class="btn sm w" data-act="newKontakt">Kontakt anlegen</button></div></li>' +
    '</ol></div></section>';
}

/* ---------- Kontakte ---------- */
function ownerFilterOpts(val){
  const team = Object.values(S.data.team).sort(byName);
  return opts([{v:'alle', l:'Alle Verantwortlichen'}].concat(team.map(t => ({v:t.id, l:t.name}))).concat([{v:'keiner', l:'Ohne Verantwortlichen'}]), val);
}
function naeheFilterOpts(val){
  return opts([{v:'alle', l:'Alle Entfernungen'}].concat(NAEHE_ORDER.map(n => ({v:n, l:NAEHE[n].l}))), val);
}
function seg(key, val, list){
  return '<div class="seg" role="group">' + list.map(x => '<button type="button" class="' + (val === x[0] ? 'on' : '') + '" data-act="ui" data-k="' + key + '" data-v="' + x[0] + '">' + esc(x[1]) + '</button>').join('') + '</div>';
}
function viewKontakte(){
  const D = S.data, ui = S.ui, q = ui.q.toLowerCase();
  let xs = Object.values(D.kontakte).map(k => ({k:k, w:wichtigkeit(k), f:D.firmen[k.firmaId]}));
  const total = xs.length;
  if (q) xs = xs.filter(x => [kName(x.k), x.k.position, x.f && x.f.name, x.k.email].join(' ').toLowerCase().includes(q));
  if (ui.klasse !== 'alle') xs = xs.filter(x => x.w.kl === ui.klasse);
  if (ui.owner === 'keiner') xs = xs.filter(x => !tName(x.k.verantwortlich));
  else if (ui.owner !== 'alle') xs = xs.filter(x => x.k.verantwortlich === ui.owner);
  if (ui.naehe !== 'alle') xs = xs.filter(x => x.w.nz === ui.naehe);
  const rank = w => ({chef:0, fuehrung:1, mitarbeiter:2}[w.st] ?? 3) + ({sehr:0, regional:1, wenig:2}[w.bk] ?? 3) * .1;
  xs.sort((a,b) => a.w.kl.localeCompare(b.w.kl) || rank(a.w) - rank(b.w) || kName(a.k).localeCompare(kName(b.k), 'de'));

  let h = '<div class="ph"><div><div class="eyebrow">Wichtigste zuerst</div><h1>Kontakte</h1></div><div class="actions"><a class="btn" href="#hilfe">Wer ist wichtig?</a><button class="btn pri w" data-act="newKontakt">Neuer Kontakt</button></div></div>' + dbNote();
  h += '<div class="tools"><div class="search"><input id="f-q" type="search" data-filter="q" value="' + esc(ui.q) + '" placeholder="Suchen nach Name, Unternehmen, Jobtitel" aria-label="Kontakte durchsuchen"></div>' +
    seg('klasse', ui.klasse, [['alle','Alle'],['A','Top'],['B','Wichtig'],['C','Normal']]) +
    '<select id="f-owner" data-filter="owner" aria-label="Verantwortlich">' + ownerFilterOpts(ui.owner) + '</select>' +
    '<select id="f-naehe" data-filter="naehe" aria-label="Entfernung">' + naeheFilterOpts(ui.naehe) + '</select></div>';
  if (loading()) return h + '<div class="panel"><div class="empty">Daten werden geladen.</div></div>';
  if (!total) return h + '<div class="panel"><div class="empty">Noch keine Kontakte. Lege zuerst ein Unternehmen an, dann den ersten Ansprechpartner.<div class="actions w" style="margin-top:10px"><button class="btn" data-act="newFirma">Unternehmen anlegen</button><button class="btn pri" data-act="newKontakt">Kontakt anlegen</button></div></div></div>';
  if (!xs.length) return h + '<div class="panel"><div class="empty">Kein Kontakt passt zu diesem Filter.</div></div>';
  h += '<div class="list"><div class="row row-h"><span>Wichtig?</span><span>Name und Unternehmen</span><span>Warum</span><span>Verantwortlich</span><span>Nächster Schritt</span></div>';
  let cur = '';
  for (const x of xs){
    if (x.w.kl !== cur){ cur = x.w.kl; h += '<div class="grp">' + badge(cur, 'sm') + '<b>' + KL[cur].viele + '</b> · ' + xs.filter(y => y.w.kl === cur).length + '</div>'; }
    h += kontaktRow(x);
  }
  return h + '</div>';
}
function kontaktRow(x){
  const k = x.k, last = S.letzter[k.id], owner = tName(k.verantwortlich);
  const next = isDate(k.wiedervorlage) ? duePill(k.wiedervorlage) + (k.naechsterSchritt ? ' <span class="muted">' + esc(k.naechsterSchritt) + '</span>' : '') :
    '<span class="muted">' + (last ? 'zuletzt ' + esc(sinceTxt(last)) : 'noch kein Kontakt') + '</span>';
  return '<a class="row" href="#k-' + k.id + '">' + badge(x.w.kl) +
    '<span class="r-main"><span class="r-title">' + esc(kName(k)) + '</span><span class="r-sub">' + esc([k.position, x.f ? x.f.name : ''].filter(Boolean).join(' · ')) + '</span>' +
    '<span class="r-meta">' + esc(warumKurz(x.w)) + '<br>' + esc(owner || 'ohne Verantwortlichen') + (isDate(k.wiedervorlage) ? ' ' + duePill(k.wiedervorlage) : '') + '</span></span>' +
    '<span class="r-col">' + esc(warumKurz(x.w)) + '</span>' +
    '<span class="r-col">' + esc(owner || 'niemand') + '</span><span class="r-col">' + next + '</span></a>';
}

/* ---------- Unternehmen ---------- */
function viewFirmen(){
  const D = S.data, ui = S.ui, q = ui.fq.toLowerCase();
  const ks = Object.values(D.kontakte);
  let xs = Object.values(D.firmen).map(f => ({f:f, n:ks.filter(k => k.firmaId === f.id).length, top:ks.filter(k => k.firmaId === f.id && kontaktKlasse(k) === 'A').length}));
  const total = xs.length;
  if (q) xs = xs.filter(x => [x.f.name, x.f.branche, x.f.standort].join(' ').toLowerCase().includes(q));
  if (ui.naehe !== 'alle') xs = xs.filter(x => naeheOf(x.f) === ui.naehe);
  const wert = f => (BEK[f.bekanntheit] ? BEK[f.bekanntheit].n : 0) + (naeheOf(f) ? NAEHE[naeheOf(f)].d : 0);
  xs.sort((a,b) => (b.f.wunschpartner ? 1 : 0) - (a.f.wunschpartner ? 1 : 0) || wert(b.f) - wert(a.f) || String(a.f.name).localeCompare(String(b.f.name), 'de'));
  let h = '<div class="ph"><div><div class="eyebrow">Wunschpartner zuerst, dann nach Bekanntheit und Nähe</div><h1>Unternehmen</h1></div><div class="actions w"><button class="btn pri" data-act="newFirma">Neues Unternehmen</button></div></div>' + dbNote();
  h += '<div class="tools"><div class="search"><input id="f-fq" type="search" data-filter="fq" value="' + esc(ui.fq) + '" placeholder="Suchen nach Name, Branche, Standort" aria-label="Unternehmen durchsuchen"></div>' +
    '<select id="f-fnaehe" data-filter="naehe" aria-label="Entfernung">' + naeheFilterOpts(ui.naehe) + '</select>' +
    '<span class="muted" style="font-size:13px;display:inline-flex;gap:8px;align-items:center">' + dots('sehr') + ' kennt fast jeder · ' + dots('regional') + ' Region · ' + dots('wenig') + ' eher unbekannt</span></div>';
  if (loading()) return h + '<div class="panel"><div class="empty">Daten werden geladen.</div></div>';
  if (!total) return h + '<div class="panel"><div class="empty">Noch keine Unternehmen. Lege das erste an, zum Beispiel einen Wunschpartner für eine Exkursion.<div class="actions w" style="margin-top:10px"><button class="btn pri" data-act="newFirma">Unternehmen anlegen</button></div></div></div>';
  if (!xs.length) return h + '<div class="panel"><div class="empty">Kein Unternehmen passt zur Suche.</div></div>';
  h += '<div class="list"><div class="row fr row-h"><span></span><span>Unternehmen</span><span>Nähe</span><span>Stand</span><span>Verantwortlich</span></div>';
  let cur = null;
  for (const x of xs){
    const f = x.f, g = f.wunschpartner ? 'w' : 'r';
    if (g !== cur){ cur = g; const n = xs.filter(y => (y.f.wunschpartner ? 'w' : 'r') === g).length; h += '<div class="grp"><b>' + (g === 'w' ? 'Wunschpartner' : 'Weitere Unternehmen') + '</b> · ' + n + '</div>'; }
    const last = S.firmaLetzter[f.id];
    const sub = [f.branche, x.n + ' Ansprechpartner' + (x.top ? ', davon ' + x.top + ' Top' : '')].filter(Boolean).join(' · ');
    h += '<a class="row fr" href="#u-' + f.id + '">' + dots(f.bekanntheit) +
      '<span class="r-main"><span class="r-title">' + esc(f.name) + '</span><span class="r-sub">' + esc(sub) + '</span>' +
      '<span class="r-meta">' + esc([BEK[f.bekanntheit] ? BEK[f.bekanntheit].l : 'Bekanntheit fehlt', naeheText(f), f.stand, tName(f.verantwortlich)].filter(Boolean).join(' · ')) + '</span></span>' +
      '<span class="r-col">' + esc(naeheText(f)) + '</span>' +
      '<span class="r-col">' + esc(f.stand || 'Kein Kontakt') + (last ? ' · zuletzt ' + esc(sinceTxt(last)) : '') + '</span>' +
      '<span class="r-col">' + esc(tName(f.verantwortlich) || 'niemand') + '</span></a>';
  }
  return h + '</div>';
}

/* ---------- Kontakt-Detail ---------- */
function verlaufList(entries, showKontakt){
  if (!entries.length) return '<div class="empty">Noch keine Einträge. Trage jede Mail, jeden Anruf und jedes Treffen ein, dann weiß das ganze Team Bescheid.</div>';
  entries.sort((a,b) => String(b.datum).localeCompare(String(a.datum)) || String(b.erstellt).localeCompare(String(a.erstellt)));
  return '<ul class="tl">' + entries.map(v => {
    const k = S.data.kontakte[v.kontaktId], a = S.data.anfragen[v.anfrageId];
    const meta = [tName(v.von) ? 'von ' + tName(v.von) : '', showKontakt && k ? kName(k) : '', a ? fmtKurz(a.format) : ''].filter(Boolean).join(' · ');
    return '<li><span class="d">' + fmtDE(v.datum) + '</span><div class="c"><span class="chip">' + esc(v.art || 'Eintrag') + '</span>' +
      (v.ergebnis ? ' <b style="font-size:14px">' + esc(v.ergebnis) + '</b>' : '') + '<p>' + esc(v.inhalt) + '</p>' + (meta ? '<div class="m">' + esc(meta) + '</div>' : '') + '</div>' +
      '<button class="btn ghost sm w" data-act="delVerlauf" data-id="' + v.id + '" aria-label="Eintrag löschen">Löschen</button></li>';
  }).join('') + '</ul>';
}
function anfragenList(list){
  if (!list.length) return '<div class="empty">Noch keine Anfrage.</div>';
  return '<ul class="il">' + list.map(a => '<li><span class="chip">' + esc(fmtKurz(a.format)) + '</span><div class="grow"><button class="linkbtn t" data-act="editAnfrage" data-id="' + a.id + '">' + esc(a.titel || fmtKurz(a.format) + ' · ' + fName(S.data.firmen[a.firmaId])) + '</button><div class="s">' + esc(stufeLabel(a.stufe)) + (anfrageSemester(a) ? ' · ' + esc(anfrageSemester(a)) : '') + (isDate(a.termin) ? ' · Termin ' + fmtDE(a.termin) : '') + '</div></div><div class="side">' + duePill(a.wiedervorlage) + '</div></li>').join('') + '</ul>';
}
function viewKontakt(id){
  const D = S.data, k = D.kontakte[id];
  if (!k) return notFound('Diesen Kontakt', 'kontakte');
  const f = D.firmen[k.firmaId], w = wichtigkeit(k), kl = w.kl;
  const kn = find(KENNT, normKennt(k.erreichbarkeit)), me = meId();
  let h = '<a class="back" href="#kontakte">Kontakte</a>' + dbNote();
  if (k.verantwortlich && me && k.verantwortlich !== me && tName(k.verantwortlich)) h += '<div class="note">' + esc(tName(k.verantwortlich)) + ' betreut diesen Kontakt. Bitte vor dem Anschreiben absprechen.</div>';
  else if (!tName(k.verantwortlich)) h += '<div class="note warn"><b>Niemand ist verantwortlich.</b> Jeder Kontakt braucht genau eine Person aus dem Team, die ihn betreut.</div>';
  if (kl === 'A') h += '<div class="note gold"><b>Top-Kontakt.</b> Zuerst drum kümmern und vorher kurz im Team Bescheid geben.</div>';
  h += '<div class="dh">' + badge(kl, 'lg') + '<div class="dh-main"><h1>' + esc(kName(k)) + '</h1><div class="sub">' + esc(k.position || 'Jobtitel fehlt') + (f ? ' bei <a href="#u-' + f.id + '">' + esc(f.name) + '</a>' : '') + '</div>' +
    '<div class="chips">' + (w.st ? '<span class="chip">' + POS[w.st].l + '</span>' : '') + (w.nz ? '<span class="chip">' + NAEHE[w.nz].l + '</span>' : '') + '<span class="chip">' + esc(kn.k) + '</span>' +
    (w.hfwu ? '<span class="chip">HfWU-Bezug</span>' : '') + (k.rolle ? '<span class="chip">' + esc(k.rolle) + '</span>' : '') + '</div></div>' +
    '<div class="actions w"><button class="btn pri" data-act="newVerlauf" data-kontakt="' + k.id + '">Verlauf eintragen</button><button class="btn" data-act="anschreiben" data-id="' + k.id + '">Anschreiben erstellen</button><button class="btn" data-act="editKontakt" data-id="' + k.id + '">Bearbeiten</button></div></div>';

  let main = '<section class="panel"><div class="panel-h"><h2>Nächster Schritt</h2><button class="btn sm w" data-act="schritt" data-id="' + k.id + '">' + (k.naechsterSchritt || isDate(k.wiedervorlage) ? 'Ändern' : 'Planen') + '</button></div><div class="panel-b">';
  main += (k.naechsterSchritt || isDate(k.wiedervorlage)) ? '<div class="next"><span class="what">' + esc(k.naechsterSchritt || 'Wiedervorlage') + '</span><span>' + duePill(k.wiedervorlage) + (isDate(k.wiedervorlage) ? ' <span class="mono muted">' + fmtDE(k.wiedervorlage) + '</span>' : '') + '</span></div>' :
    '<p class="muted">Kein nächster Schritt geplant. Regel im Team: Kein offener Kontakt ohne nächsten Schritt mit Datum.</p>';
  main += '</div></section>';
  const vs = Object.values(D.verlauf).filter(v => v.kontaktId === k.id);
  main += '<section class="panel"><div class="panel-h"><h2>Verlauf · ' + vs.length + '</h2><button class="btn sm w" data-act="newVerlauf" data-kontakt="' + k.id + '">Eintragen</button></div>' + verlaufList(vs, false) + '</section>';

  let h = '<div class="org">';

    h += '<div class="lvl"><div class="lvl-h">' + (st ? POS[st].l : 'Stufe unbekannt') + '</div><div class="lvl-c">';

/* ---------- Anfragen ---------- */
function viewAnfragen(){
  const D = S.data, ui = S.ui, cur = semesterOf(todayStr());
  const semVal = ui.semester === 'aktuell' ? cur : ui.semester;
  let as = Object.values(D.anfragen);
  const total = as.length;
  if (semVal !== 'alle') as = as.filter(a => { const s = anfrageSemester(a); return s === semVal || (!s && semVal === cur); });
  if (ui.format !== 'alle') as = as.filter(a => a.format === ui.format);
  const sems = semesterList();
  for (const a of Object.values(D.anfragen)){ const s = anfrageSemester(a); if (s && !sems.includes(s)) sems.push(s); }
  let h = '<div class="ph"><div><div class="eyebrow">Von der Recherche bis zum Dank</div><h1>Anfragen</h1></div><div class="actions w"><button class="btn pri" data-act="newAnfrage">Neue Anfrage</button></div></div>' + dbNote();
  h += '<div class="tools"><select id="f-sem" data-filter="semester" aria-label="Semester">' + opts([{v:'alle', l:'Alle Semester'}].concat(sems.map(s => ({v:s, l:s + (s === cur ? ' (aktuell)' : '')}))), semVal) + '</select>' +
    '<select id="f-format" data-filter="format" aria-label="Format">' + opts([{v:'alle', l:'Alle Formate'}].concat(FORMATE.map(x => ({v:x, l:x}))), ui.format) + '</select>' +
    '<span class="muted" style="font-size:13px">' + as.length + ' von ' + total + ' Anfragen</span></div>';
  if (loading()) return h + '<div class="panel"><div class="empty">Daten werden geladen.</div></div>';
  if (!total) return h + '<div class="panel"><div class="empty">Noch keine Anfrage. Eine Anfrage ist ein Vorhaben mit einem Unternehmen, zum Beispiel eine Exkursion oder ein Vortrag an der HfWU.<div class="actions w" style="margin-top:10px"><button class="btn pri" data-act="newAnfrage">Anfrage anlegen</button></div></div></div>';
  h += '<div class="board">' + STUFEN.map(s => {
    const inS = as.filter(a => (a.stufe || 'recherche') === s.v).sort((x,y) => String(x.wiedervorlage || '9').localeCompare(String(y.wiedervorlage || '9')));
    return '<div class="col"><div class="col-h"><span>' + esc(s.l) + '</span><b>' + inS.length + '</b></div>' + inS.map(anfrageCard).join('') + '</div>';
  }).join('') + '</div>';
  const aus = as.filter(a => a.stufe === 'spaeter' || a.stufe === 'abgesagt');
  if (aus.length) h += '<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Später wieder und abgesagt · ' + aus.length + '</h2></div>' + anfragenList(aus) + '</section>';
  return h;
}
function anfrageCard(a){
  const D = S.data, f = D.firmen[a.firmaId], k = D.kontakte[a.kontaktId];
  const i = STUFEN.findIndex(s => s.v === (a.stufe || 'recherche'));
  return '<div class="card"><div class="card-top"><span class="chip">' + esc(fmtKurz(a.format) || 'Anfrage') + '</span>' + (k ? badge(kontaktKlasse(k), 'sm') : '') + '</div>' +

    '<div class="card-s">' + (a.titel && f ? '<a href="#u-' + f.id + '">' + esc(f.name) + '</a>' : '') + (a.titel && f && k ? ' · ' : '') + (k ? '<a href="#k-' + k.id + '">' + esc(kName(k)) + '</a>' : (a.titel ? '' : 'Noch kein Ansprechpartner')) + (f && f.wunschpartner ? ' · Wunschpartner' : '') + '</div>' +

    (a.naechsterSchritt || isDate(a.wiedervorlage) ? '<div class="card-s">' + esc(a.naechsterSchritt || 'Wiedervorlage') + ' ' + duePill(a.wiedervorlage) + '</div>' : '') +

    (i < STUFEN.length - 1 ? '<button class="btn sm" data-act="stufe" data-id="' + a.id + '" data-dir="1">Weiter</button>' : '') + '</span></div></div>';

  const alt = Object.values(D.kontakte).filter(k => { const s = S.letzter[k.id] || dateOf(k.erstellt); return s && daysBetween(s, today) > 730; });

/* ---------- Formulare ---------- */
function berichtetOpts(firmaId, selfId, val){
  const rank = k => ({chef:0, fuehrung:1, mitarbeiter:2}[posOf(k)] ?? 3);
  const ks = Object.values(S.data.kontakte).filter(k => k.firmaId === firmaId && k.id !== selfId).sort((a,b) => rank(a) - rank(b));
  return opts(ks.map(k => ({v:k.id, l:kName(k) + (k.position ? ', ' + k.position : '')})), val, 'Niemand oder unbekannt');
}
function kontaktOpts(firmaId, val){
  const ks = Object.values(S.data.kontakte).filter(k => !firmaId || k.firmaId === firmaId).sort((a,b) => kName(a).localeCompare(kName(b), 'de'));
  return opts(ks.map(k => ({v:k.id, l:kName(k) + (firmaId ? '' : ' · ' + fName(S.data.firmen[k.firmaId]))})), val, 'Kein bestimmter Kontakt');
}
function firmenOpts(val, empty){ return opts(Object.values(S.data.firmen).sort(byName).map(f => ({v:f.id, l:f.name})), val, empty); }

      F('Rolle für uns', 'm-rolle', sel('m-rolle', 'rolle', opts(ROLLEN, k.rolle, 'Noch unklar')), {full:true}) +

      F('Ansprache', 'm-form', sel('m-form', 'form', opts([{v:'Sie', l:'Sie'}, {v:'Du', l:'Du'}], k.form))) +

  openModal(id ? 'Kontakt bearbeiten' : 'Neuer Kontakt', body, {

    onOpen(root){
      const form = root.querySelector('form');

      const nid = await put('kontakte', obj);
      toast('Kontakt gespeichert');
      if (!id) location.hash = '#k-' + nid;

  });

/* ---------- Export und Import ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const s = document.createElement('script'); s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('Die Excel-Bibliothek konnte nicht geladen werden.'));
    document.head.appendChild(s);
  });
}
async function getDownloads(){
  return {save: async o => {
    const typ = /\.xlsx$/.test(o.filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/json';
    const url = URL.createObjectURL(new Blob([o.data], {type:typ}));
    const a = document.createElement('a'); a.href = url; a.download = o.filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }};
}
async function saveFile(dl, filename, data){
  try { await dl.save({filename:filename, data:data}); toast('Datei gespeichert'); }
  catch(e){ toast('Speichern nicht möglich' + (e && e.message ? ': ' + e.message : '.'), 'err'); }
}

async function exportJson(){

  for (const c of COLS) out[c] = Object.values(S.data[c]);

}
async function importJson(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch(e){ toast('Die Datei ist keine gültige Sicherung.', 'err'); return; }
  if (!data || data.app !== 'ep-crm'){ toast('Die Datei ist keine Sicherung dieses CRM.', 'err'); return; }
  const rows = [];
  for (const c of COLS) for (const r of (Array.isArray(data[c]) ? data[c] : [])){
    if (r && typeof r === 'object' && typeof r.id === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(r.id)) rows.push([c, r]);
  }
  const cnt = COLS.map(c => rows.filter(r => r[0] === c).length);
  openConfirm('Sicherung einspielen', 'Die Datei enthält ' + cnt[0] + ' Unternehmen, ' + cnt[1] + ' Kontakte, ' + cnt[2] + ' Anfragen, ' + cnt[3] + ' Verlaufseinträge, ' + cnt[4] + ' Vorlagen und ' + cnt[5] + ' Teammitglieder. Einträge mit gleicher Kennung werden überschrieben, alle anderen bleiben erhalten.', 'Einspielen', async () => {
    if (!S.db){ toast('Keine Verbindung zur Datenbank.', 'err'); throw new Error('nodb'); }
    let n = 0;
    for (const r of rows){
      const body = Object.assign({}, r[1]); delete body.id;
      try { await S.db.collection(r[0]).doc(r[1].id).set(body); n++; } catch(e){ writeErr(e); throw e; }
    }
    toast(n + ' Einträge eingespielt');
  });
}

async function copyText(text, fallbackEl){
  try { await navigator.clipboard.writeText(text); toast('Kopiert'); }
  catch(e){ if (fallbackEl && fallbackEl.select){ fallbackEl.focus(); fallbackEl.select(); toast('Text ist markiert. Kopiere ihn mit Strg+C oder Cmd+C.'); } else toast('Kopieren hat nicht geklappt. Bitte von Hand markieren.', 'err'); }
}
async function moveStufe(id, dir){
  const a = S.data.anfragen[id]; if (!a) return;
  let i = STUFEN.findIndex(s => s.v === (a.stufe || 'recherche'));
  i = Math.max(0, Math.min(STUFEN.length - 1, i + dir));
  const neu = Object.assign({}, a, {stufe:STUFEN[i].v}), t = todayStr();
  if (dir > 0){
    const k = S.data.kontakte[a.kontaktId], kl = k ? kontaktKlasse(k) : 'B';
    if (neu.stufe === 'erstkontakt'){ neu.naechsterSchritt = 'Nachfassen'; neu.wiedervorlage = addDays(t, NACHFASSEN[kl]); }
    else if (neu.stufe === 'nachgefasst'){ neu.naechsterSchritt = 'Telefonisch nachhaken'; neu.wiedervorlage = addDays(t, 7); }
    else if (neu.stufe === 'zugesagt'){ neu.naechsterSchritt = 'Termin und Ablauf abstimmen'; neu.wiedervorlage = addDays(t, 7); }
    else if (neu.stufe === 'durchgefuehrt'){ neu.naechsterSchritt = 'Dank senden (innerhalb von 48 Stunden)'; neu.wiedervorlage = addDays(t, 2); }
    else if (neu.stufe === 'nachbereitet'){ neu.naechsterSchritt = ''; neu.wiedervorlage = ''; }
  }
  await put('anfragen', neu);
  toast('Verschoben nach „' + STUFEN[i].l + '“');
}

  },
  newFirma: () => openFirmaForm(null),
  editFirma: d => openFirmaForm(d.id),
  delFirma: d => {
    const f = S.data.firmen[d.id]; if (!f) return;
    const nk = Object.values(S.data.kontakte).filter(k => k.firmaId === d.id).length;
    const na = Object.values(S.data.anfragen).filter(a => a.firmaId === d.id).length;
    if (nk || na){ openInfo('Löschen nicht möglich', esc(f.name) + ' hat noch ' + nk + ' Ansprechpartner und ' + na + ' Anfragen. Lösche diese zuerst.'); return; }
    openConfirm('Unternehmen löschen', esc(f.name) + ' wird endgültig gelöscht. Das lässt sich nicht rückgängig machen.', 'Endgültig löschen', async () => { await del('firmen', d.id); location.hash = '#unternehmen'; toast('Unternehmen gelöscht'); });
  },
  newAnfrage: d => openAnfrageForm(null, Object.assign({}, d.firma ? {firmaId:d.firma} : {}, d.kontakt ? {kontaktId:d.kontakt} : {})),
  editAnfrage: d => openAnfrageForm(d.id),
  delAnfrage: d => {
    const a = S.data.anfragen[d.id]; if (!a) return;
    openConfirm('Anfrage löschen', 'Die Anfrage „' + esc(a.titel || fmtKurz(a.format)) + '“ wird endgültig gelöscht.', 'Endgültig löschen', async () => { await del('anfragen', d.id); toast('Anfrage gelöscht'); });
  },
  stufe: d => moveStufe(d.id, Number(d.dir)).catch(() => {}),
  newVerlauf: d => openVerlaufForm({kontakt:d.kontakt, firma:d.firma}),
  delVerlauf: d => openConfirm('Eintrag löschen', 'Dieser Eintrag im Verlauf wird endgültig gelöscht.', 'Löschen', async () => { await del('verlauf', d.id); toast('Eintrag gelöscht'); }),
  schritt: d => openSchritt(d.id),
  schrittErledigt: async d => { const k = S.data.kontakte[d.id]; if (!k) return; closeModal(); try { await put('kontakte', Object.assign({}, k, {naechsterSchritt:'', wiedervorlage:''})); toast('Als erledigt markiert. Plane gleich den nächsten Schritt.'); } catch(e){} },
  anschreiben: d => openAnschreiben(d.id),
  newVorlage: () => openVorlageForm(null),
  editVorlage: d => openVorlageForm(d.id),
  delVorlage: d => { const v = S.data.vorlagen[d.id]; if (!v) return; openConfirm('Vorlage löschen', 'Die Vorlage „' + esc(v.name) + '“ wird endgültig gelöscht.', 'Löschen', async () => { await del('vorlagen', d.id); toast('Vorlage gelöscht'); }); },
  newTeam: () => openTeamForm(null),
  renameTeam: d => openTeamForm(d.id),
  delTeam: d => {
    const m = S.data.team[d.id]; if (!m) return;
    const n = ['kontakte','firmen','anfragen'].reduce((s, c) => s + Object.values(S.data[c]).filter(x => x.verantwortlich === d.id).length, 0);
    if (n){ openInfo('Erst übertragen', esc(m.name) + ' ist noch für ' + n + ' Einträge verantwortlich. Übertrage sie zuerst an eine andere Person.', '<button type="button" class="btn pri" data-act="transfer" data-von="' + d.id + '">Kontakte übertragen</button>'); return; }
    openConfirm('Mitglied entfernen', esc(m.name) + ' wird aus dem Team entfernt.', 'Entfernen', async () => { await del('team', d.id); toast(m.name + ' wurde entfernt'); });
  },
  transfer: d => openTransfer(d.von),
  exportXlsx: () => exportXlsx(),
  exportJson: () => exportJson(),
  importJson: () => { const i = $('#import-file'); i.value = ''; i.click(); },
  copy: d => copyText(d.text),
  copyField: d => { const el = document.getElementById(d.target); if (el) copyText(el.value, el); },
  abmelden: () => abmelden(),
  neuLaden: () => location.reload(),
  modus: d => { AUTH.modus = d.m; AUTH.info = ''; renderGate(); },
  pruefen: () => pruefeZugang(),
  bestaetigt: async () => {
    const u = AUTH.user; if (!u) return;
    try { await u.reload(); await u.getIdToken(true); } catch(e){}
    AUTH.user = AUTH.auth.currentUser || u;
    if (!AUTH.user.emailVerified) toast('Noch nicht bestätigt. Klicke zuerst auf den Link in der E-Mail.', 'err');
    pruefeZugang();
  },
  mailNochmal: async () => {
    try { await AUTH.fb.sendEmailVerification(AUTH.user); toast('E-Mail ist unterwegs.'); }
    catch(e){ toast(authFehler(e), 'err'); }
  },
  newZugang: () => openZugangForm(),
  rolleZugang: d => {
    const z = AUTH.zugang[d.id]; if (!z) return;
    const neu = z.rolle === 'verwalter' ? 'mitglied' : 'verwalter';
    openConfirm(neu === 'verwalter' ? 'In die Verwaltung' : 'Zum Mitglied machen', esc(d.id) + (neu === 'verwalter' ? ' kann danach selbst Leute freischalten und entfernen.' : ' kann danach niemanden mehr freischalten oder entfernen.'), 'Ändern', async () => {
      const body = Object.assign({}, z, {rolle:neu}); delete body.id;
      await zugangSchreiben(d.id, body); toast('Rolle geändert');
    });
  },
  delZugang: d => {
    if (!AUTH.zugang[d.id]) return;
    openConfirm('Zugang entfernen', esc(d.id) + ' kommt danach nicht mehr ins CRM. Kontakte und Einträge der Person bleiben erhalten.', 'Entfernen', async () => {
      await zugangSchreiben(d.id, null); toast('Zugang entfernt');
    });
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el);
});
function onFilter(e){
  const el = e.target;
  if (!el.dataset || !el.dataset.filter) return;
  S.ui[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value;
  scheduleRender();
}
document.addEventListener('input', onFilter);
document.addEventListener('change', onFilter);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').firstChild) closeModal(); });
$('#me-select').addEventListener('change', e => { S.me = e.target.value; lsSet('ep-crm-ich', S.me); lastTeamKey = ''; render(); });
$('#import-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importJson(f); });
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });

document.addEventListener('submit', e => { if (e.target && e.target.id === 'login'){ e.preventDefault(); loginSubmit(e.target); } });
render();
showGate('laden');
connect();
})();
</script>

</body></html>
